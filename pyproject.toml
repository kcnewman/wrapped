[project]
name = "wrapped"
version = "0.1.0"
description = "A listening wrap from Last.fm scrobbles"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115",
    "jinja2>=3.1",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "requests>=2.34.2",
    "uvicorn>=0.30",
]

[project.optional-dependencies]
dev = ["httpx>=0.27", "mypy>=1.11", "pytest>=8", "ruff>=0.8", "types-requests"]

[project.scripts]
wrapped = "wrapped.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["wrapped"]

[tool.mypy]
python_version = "3.12"
check_untyped_defs = true
